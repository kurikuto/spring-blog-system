# Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/spring_blog_system}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.show-sql=${DB_SHOW_SQL:true}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# data.sqlを自動実行（Spring Boot 2.5以降必要）
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# JWT Configuration
jwt.secret=${JWT_SECRET:please_change_this_secret_key_in_production}
jwt.expiration=${JWT_EXPIRATION:3600000}

# Logging
logging.level.org.springframework=${LOG_LEVEL_SPRING:INFO}
logging.level.com.example.blog=${LOG_LEVEL_APP:DEBUG}

# Server Configuration
server.port=${SERVER_PORT:8080}

# Admin User Configuration
admin.username=${ADMIN_USERNAME:admin}
admin.email=${ADMIN_EMAIL:admin@example.com}
admin.password=${ADMIN_PASSWORD:admin123}